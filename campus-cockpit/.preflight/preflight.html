<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* =============================================================
   绵小城 · 移动驾驶舱 — 品牌 Token（清爽升级版）
   Prefix: mc   |   Single brand hue: blue
   ============================================================= */

:root,
html.light {
  /* --- Surfaces --- */
  --mc-background: #f2f5fb;
  --mc-foreground: #16203a;
  --mc-card: #ffffff;
  --mc-card-foreground: #16203a;
  --mc-popover: #ffffff;
  --mc-popover-foreground: #16203a;
  --mc-muted: #eef1f8;
  --mc-muted-foreground: #6b7690;
  --mc-border: #e3e8f3;
  --mc-input: #e3e8f3;
  --mc-ring: #2f6fed;

  /* --- Brand (single hue) --- */
  --mc-primary: #2f6fed;
  --mc-primary-foreground: #ffffff;
  --mc-primary-soft: #e8f0ff;
  --mc-primary-softer: #f3f7ff;
  --mc-primary-strong: #1f57cc;
  --mc-primary-track: #e0e7f6;

  /* --- Text steps --- */
  --mc-ink-2: #5a647e;
  --mc-ink-3: #97a0b6;

  /* --- Status (semantic only) --- */
  --mc-state-success: #16a34a;
  --mc-state-success-soft: #e7f6ec;
  --mc-state-warning: #d97706;
  --mc-state-warning-soft: #fdf3e3;
  --mc-state-error: #dc2626;
  --mc-state-info: #2f6fed;

  /* --- Radius --- */
  --mc-radius-sm: 8px;
  --mc-radius-md: 12px;
  --mc-radius-lg: 16px;
  --mc-radius-pill: 999px;

  /* --- Shadow (subtle, alpha <= 0.05 for static surfaces) --- */
  --mc-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --mc-shadow-md: 0 10px 26px -14px rgba(15, 23, 42, 0.18);

  /* --- Type --- */
  --mc-font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "HarmonyOS Sans SC",
    system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mc-font-num: "Inter", "PingFang SC", system-ui, sans-serif;

  /* --- Spacing rhythm --- */
  --mc-gap-block: 14px;
  --mc-pad-card: 16px;
  --mc-safe-bottom: 72px;
}

html.dark {
  --mc-background: #10131c;
  --mc-foreground: #e9edf6;
  --mc-card: #191e2b;
  --mc-card-foreground: #e9edf6;
  --mc-popover: #191e2b;
  --mc-popover-foreground: #e9edf6;
  --mc-muted: #222838;
  --mc-muted-foreground: #9aa3ba;
  --mc-border: #2a3244;
  --mc-input: #2a3244;
  --mc-ring: #5b8dff;
  --mc-primary: #5b8dff;
  --mc-primary-foreground: #0d1220;
  --mc-primary-soft: #1d2740;
  --mc-primary-softer: #181f30;
  --mc-primary-strong: #82a8ff;
  --mc-primary-track: #26304a;
  --mc-ink-2: #b3bcd2;
  --mc-ink-3: #7c86a0;
  --mc-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
  --mc-shadow-md: 0 12px 28px -16px rgba(0, 0, 0, 0.6);
}

html,
body {
  font-family: var(--mc-font-sans);
  background: var(--mc-background);
  color: var(--mc-foreground);
}

/* Typographic helper classes (optional, token-sourced) */
.mc-num {
  font-family: var(--mc-font-num);
  font-variant-numeric: tabular-nums;
}
.mc-display {
  font-size: 34px;
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.mc-h2 {
  font-size: 16px;
  line-height: 1.3;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.mc-body {
  font-size: 14px;
  line-height: 1.6;
}
.mc-caption {
  font-size: 12px;
  line-height: 1.5;
  color: var(--mc-ink-3);
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--mc-background);
    --color-foreground: var(--mc-foreground);
    --color-card: var(--mc-card);
    --color-card-foreground: var(--mc-card-foreground);
    --color-popover: var(--mc-popover);
    --color-popover-foreground: var(--mc-popover-foreground);
    --color-primary: var(--mc-primary);
    --color-primary-foreground: var(--mc-primary-foreground);
    --color-muted: var(--mc-muted);
    --color-muted-foreground: var(--mc-muted-foreground);
    --color-border: var(--mc-border);
    --color-input: var(--mc-input);
    --color-ring: var(--mc-ring);
    --radius-sm: var(--mc-radius-sm);
    --radius-md: var(--mc-radius-md);
    --radius-lg: var(--mc-radius-lg);
  }
  @layer base {
    body { background: var(--mc-background); color: var(--mc-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .border-card-foreground { border-color: var(--mc-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--mc-card-foreground); }
      .bg-popover { background-color: var(--mc-popover); }

      .bg-primary { background-color: var(--mc-primary); }
      .text-primary { color: var(--mc-primary); }
      .border-primary { border-color: var(--mc-primary); }
      .ring-primary { --tw-ring-color: var(--mc-primary); }
      .bg-primary-foreground { background-color: var(--mc-primary-foreground); }
      .text-primary-foreground { color: var(--mc-primary-foreground); }
      .border-primary-foreground { border-color: var(--mc-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--mc-primary-foreground); }
      .bg-muted { background-color: var(--mc-muted); }

      .ring-muted-foreground { --tw-ring-color: var(--mc-muted-foreground); }
      .bg-border { background-color: var(--mc-border); }
      .text-border { color: var(--mc-border); }
      .border-border { border-color: var(--mc-border); }

      .bg-input { background-color: var(--mc-input); }
      .text-input { color: var(--mc-input); }
      .border-input { border-color: var(--mc-input); }
      .ring-input { --tw-ring-color: var(--mc-input); }
      .bg-ring { background-color: var(--mc-ring); }

    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        -webkit-mask-repeat: no-repeat;

        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
