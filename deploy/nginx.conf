# nginx 站点配置（docker-compose 挂载为 /etc/nginx/conf.d/default.conf）
# 职责：静态资源托管（SPA）+ /api 反向代理（含 WebSocket 升级）+ 大文件上传

# WebSocket 升级映射。
# 注意：语音通话与消息推送的 WS 端点都在 /api/ 下（/api/voice/ws、
# /api/messages/ws），若 /api/ 沿用普通反向代理（HTTP/1.0 + 无 Upgrade 头），
# 升级请求会被当成普通 HTTP 请求转发，握手直接失败 —— 前端表现就是
# 「语音通话连接失败」，移动端跑到线上必踩。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 上传/下载上限 600MB（智慧校园多媒体归档场景）
    client_max_body_size 600m;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物哈希资源：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API（含 /api/files 鉴权下载）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级：/api/voice/ws 与 /api/messages/ws 走同一 location，
        # 普通 HTTP 请求的 $http_upgrade 为空，Connection 回落为 close，不受影响
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 旧 /uploads URL 兼容路由（files.py 顶层注册，同样鉴权）
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket（消息推送 / AI 语音通话）
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}