# nginx 站点配置 —— HTTPS 版
#
# 用法：由 deploy/enable_https.sh 申请证书后自动切换（把 .env 的 NGINX_CONF
#       指向本文件并重建 frontend 容器）。未申请证书前不要启用，否则 nginx
#       会因找不到证书文件而启动失败。
#
# 证书路径固定为 /etc/nginx/certs/{fullchain,privkey}.pem，由 compose 把
# ./deploy/certs 挂载到 /etc/nginx/certs:ro。enable_https.sh 会把
# letsencrypt/live/<域名>/ 下的文件同步成这两个固定名，避免域名变化时
# 还要改 nginx 配置。

# WebSocket 升级映射。
# 语音通话与消息推送的 WS 端点都在 /api/ 下（/api/voice/ws、/api/messages/ws），
# 若 /api/ 沿用普通反向代理（HTTP/1.0 + 无 Upgrade 头），升级请求会被当成
# 普通 HTTP 请求转发，握手直接失败 —— 前端表现就是「语音通话连接失败」。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- 80：仅做 ACME 校验与跳转 ----------
server {
    listen 80;
    server_name _;

    # 证书续期走 webroot，无需停服务
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：正式服务 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 协议与套件：兼容 Android 7+ / iOS 12+ 的常见校园设备
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：确认全站可走 HTTPS 后再开，开启后浏览器会强制 HTTPS 一段时间
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 上传/下载上限 600MB（智慧校园多媒体归档场景）
    client_max_body_size 600m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    root /usr/share/nginx/html;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API（含 /api/files 鉴权下载）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级：普通 HTTP 请求的 $http_upgrade 为空，
        # Connection 回落为 close，不受影响
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 旧 /uploads URL 兼容路由（files.py 顶层注册，同样鉴权）
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket（消息推送 / AI 语音通话）
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
