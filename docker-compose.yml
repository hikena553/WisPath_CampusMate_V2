name: smart-campus

# 部署编排：db(MySQL) + backend(API) + frontend(nginx)
# 机密/连接串全部经 .env 注入（.env 不入库，模板见 .env.example）
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_campus}
      MYSQL_USER: ${MYSQL_USER:-campus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      # 与本地开发库、database.py 建库语句保持一致：MySQL 8 默认 utf8mb4_0900_ai_ci
      # （unicode_ci 排序规则更老，二者混用会导致 JOIN 时 "Illegal mix of collations"）
      - --collation-server=utf8mb4_0900_ai_ci
      # 时区跟随 TZ；用 +08:00 偏移量写法可避免依赖 mysql 内置时区表
      - --default-time-zone=+08:00
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-smart_campus}?charset=utf8mb4
      # 迁移连接串：留空即回落到 DATABASE_URL（容器首次初始化时 MYSQL_USER 拿到的是该库
      # ALL PRIVILEGES，单容器部署能跑通）。要落实「应用账号无 DDL 权限」，就在这里填
      # 独立的 campus_ddl 连接串，并按 docs/数据库规范.md §5 建账号矩阵。
      # 不用嵌套默认值是刻意的：compose 对 ${A:-${B}} 这类嵌套展开支持不稳定。
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      # 单容器 true；要水平扩容到多副本时必须改 false，迁移改成发布流水线里的一次性步骤，
      # 否则 N 个副本并发 upgrade 会抢 DDL 锁、且任何一个失败都会让该副本起不来。
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY（至少 32 位随机串）}
      # ⚠️ LLM 默认值必须与 backend/app/core/config.py 的字段默认值保持一致。
      # 若两边不一致，.env 漏写某一项时容器内会被 compose 注入「另一套模型」，
      # 表现为线上 AI 回复风格/能力与本地开发环境完全不同，且日志无任何异常提示。
      # 生产环境仍建议在 .env 中逐项写死，不要依赖默认值。
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://maas.qianwenaiapi.com/compatible-mode/v1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen3.8-27b}
      LLM_AGENT_MODEL: ${LLM_AGENT_MODEL:-qwen3.8-27b}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-qwen3.8-max}
      LLM_AGENT_TEMPERATURE: ${LLM_AGENT_TEMPERATURE:-0.7}
      LLM_AGENT_MAX_TOKENS: ${LLM_AGENT_MAX_TOKENS:-10000}
      # 语音网关（ASR/TTS）。留空时后端回退到 DASHSCOPE_API_KEY / 由 LLM_BASE_URL 推导网关；
      # 本地 backend/.env 若单独配了语音账号，这里必须一并透传，否则线上语音通话静默不可用。
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      VOICE_BASE_URL: ${VOICE_BASE_URL:-}
      # QQ 互联回跳与短信登录落地页的站点根地址；默认 localhost 会让线上回跳落到本机
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      # 手机号短信验证码登录（可选）。SMS_PROVIDER 留空则生产环境直接拒绝短信登录
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      TENCENT_SMS_SECRET_ID: ${TENCENT_SMS_SECRET_ID:-}
      TENCENT_SMS_SECRET_KEY: ${TENCENT_SMS_SECRET_KEY:-}
      TENCENT_SMS_APP_ID: ${TENCENT_SMS_APP_ID:-}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME:-}
      TENCENT_SMS_TEMPLATE_ID: ${TENCENT_SMS_TEMPLATE_ID:-}
      # QQ 互联 OAuth 登录（可选）。QQ_REDIRECT_URI 须与 QQ 互联后台登记完全一致
      QQ_APP_ID: ${QQ_APP_ID:-}
      QQ_APP_KEY: ${QQ_APP_KEY:-}
      QQ_REDIRECT_URI: ${QQ_REDIRECT_URI:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITEE_TOKEN: ${GITEE_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # 默认 1：周期任务由应用进程内调度，多 worker 会导致任务重复执行
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${NGINX_PORT:-80}:80"
      # 443 仅在启用 HTTPS 后才有 nginx 监听；HTTP 阶段映射了也无副作用
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      # 站点配置可切换：默认 HTTP 版；执行 deploy/enable_https.sh 后
      # 自动改为 ./deploy/nginx.ssl.conf（见 .env 的 NGINX_CONF）
      - ${NGINX_CONF:-./deploy/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      # TLS 证书目录（enable_https.sh 会把证书同步成 fullchain.pem/privkey.pem）
      - ./deploy/certs:/etc/nginx/certs:ro
      # ACME 校验目录：certbot 写入、nginx 读取，续期无需停服务
      - certbot_webroot:/var/www/certbot:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  db_data:
  uploads_data:
  certbot_webroot: